name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Test and vet
        run: |
          GO111MODULE=off go test -race main.go main_test.go
          GO111MODULE=off go vet main.go main_test.go

      - name: Build portable Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags='-s -w' -o campus-srun main.go
          tar -czf campus-srun-linux-amd64.tar.gz campus-srun
          sha256sum campus-srun-linux-amd64.tar.gz \
            > campus-srun-linux-amd64.tar.gz.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            campus-srun-linux-amd64.tar.gz \
            campus-srun-linux-amd64.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
